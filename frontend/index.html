<body>
    <header class="app-header">
        <div class="header-content">
            <nav class="navbar bg-body-tertiary">
                <div class="container-fluid" id="botones">

                    <div>
                        <h1>UN Calendario</h1>
                        <p>Organiza tu semana</p>
                    </div>

                    <div class="acciones">
                        <button id="limpiar" type="reset" class="btn">
                            Limpiar 
                        </button>
                        <button id="new-activity-btn" type="button" class="btn" data-bs-toggle="modal"
                            data-bs-target="#exampleModal">
                            Añadir
                        </button>


                    </div>

                </div>

            </nav>
        </div>
    </header>

    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Añadir actividad</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>



                <form id="activity-form">

                        <div class="row">
                            <div class="col-12 col-md-6 mb-3">
                                <label for="activity-name">
                                    Actividad:
                                </label>
                                <input type="text" name="" id="activity-name" required>
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label for="activity-day">Dia</label>
                                <select class="form-select" name="days" id="activity-day" required
                                    style="margin-top: 1%;">
                                    <option value="" selected disabled>
                                        Selecciona un día
                                    </option>

                                    <option value="lunes">Lunes</option>
                                    <option value="martes">Martes</option>
                                    <option value="miercoles">Miércoles</option>
                                    <option value="jueves">Jueves</option>
                                    <option value="viernes">Viernes</option>
                                    <option value="sabado">Sábado</option>
                                    <option value="domingo">Domingo</option>
                                </select>
                            </div>
                        </div>

                        <!--Horarios-->
                        <div class="row">

                            <div class="col-12 col-md-6 mb-3">
                                <label for="start-time" class="form-label">
                                    Hora de inicio
                                </label>

                                <select class="form-control" id="start-time" required>
                                    <option value="">Hora de inicio</option>
                                    <option value="00:00">00:00</option>
                                    <option value="01:00">01:00</option>
                                    <option value="02:00">02:00</option>
                                    <option value="03:00">03:00</option>
                                    <option value="04:00">04:00</option>
                                    <option value="05:00">05:00</option>
                                    <option value="06:00">06:00</option>
                                    <option value="07:00">07:00</option>
                                    <option value="08:00">08:00</option>
                                    <option value="09:00">09:00</option>
                                    <option value="10:00">10:00</option>
                                    <option value="11:00">11:00</option>
                                    <option value="12:00">12:00</option>
                                    <option value="13:00">13:00</option>
                                    <option value="14:00">14:00</option>
                                    <option value="15:00">15:00</option>
                                    <option value="16:00">16:00</option>
                                    <option value="17:00">17:00</option>
                                    <option value="18:00">18:00</option>
                                    <option value="19:00">19:00</option>
                                    <option value="20:00">20:00</option>
                                    <option value="21:00">21:00</option>
                                    <option value="22:00">22:00</option>
                                    <option value="23:00">23:00</option>

                                </select>
                            </div>

                            <div class="col-12 col-md-6 mb-3">
                                <label for="end-time" class="form-label">
                                    Hora de finalización
                                </label>

                                    <option value="00:00">00:00</option>
                                    <option value="01:00">01:00</option>
                                    <option value="02:00">02:00</option>

                                    <option value="23:00">23:00</option>
                                    <option value="23:00">24:00</option>
                                </select>
                            </div>

                                Color
                            </label>

                            <input type="color" class="form-control form-control-color" id="activity-color"

                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancelar
                        </button>

                        <button type="submit" class="btn btn-primary">
                            Confirmar actividad
